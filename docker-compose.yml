version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medical-doc-processor-app
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/medical
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SPACY_MODEL=${SPACY_MODEL:-en_core_web_sm}
      - MEDICAL_NER_MODEL=${MEDICAL_NER_MODEL:-d4data/biomedical-ner-all}
      - TERMINOLOGY_CACHE_TTL=${TERMINOLOGY_CACHE_TTL:-86400}
      - VALIDATION_STRICT=${VALIDATION_STRICT:-true}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: medical-doc-processor-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=medical
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata: