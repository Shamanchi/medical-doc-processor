[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-doc-processor"
version = "0.1.0"
description = "Medical Document Processor with NER, validation, and FHIR export"
readme = "README.md"
license = {text = "LicenseRef-Shamanchi-1.0"}
authors = [{name = "Shamanchi", email = "Lietman46@mail.ru"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3.11",
]
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "pydantic==2.5.0",
    "pydantic-settings==2.1.0",
    "httpx==0.25.0",
    "python-dotenv==1.0.0",
    "prometheus-client==0.19.0",
    "python-multipart==0.0.6",
    "openai==1.0.0",
    "fitz==0.0.1.dev2",
    "python-docx==1.1.0",
    "spacy==3.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.0",
    "pytest-asyncio==0.21.0",
    "ruff==0.0.282",
    "mypy==1.5.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501", "S101"]
exclude = [".venv", "venv", "env", "dist", "build", "__pycache__", ".pytest_cache", ".mypy_cache"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["tests", ".venv", "venv", "env"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"